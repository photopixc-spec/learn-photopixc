name: Build PhotoPixC Learn Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Prepare Web Assets for Capacitor
        run: npm run prepare:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PhotoPixC-Learn-v2.1.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPixC-Learn-Debug-v2.1.apk
          path: release-apk/PhotoPixC-Learn-v2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Public APK Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v2.1.0
          name: PhotoPixC Learn Android App v2.1.0 (Fixed Navigation & Offline Routing)
          body: |
            ## 📱 PhotoPixC Learn — Official Android App v2.1.0 (Navigation Hotfix)

            এই আপডেটে অ্যাপের সমস্ত লিংক ও নেভিগেশন শতভাগ সচল করা হয়েছে:
            - **🔗 সম্পূর্ণ কার্যকরী নেভিগেশন:** হোমপেজের প্রতিটি কার্ড এবং বাটনে চাপ দিলে সংশ্লিষ্ট স্কুলে সরাসরি নিয়ে যাবে।
            - **📱 থাম্ব-ফ্রেন্ডলি বটম বার:** হোম, সিলেবাস, ল্যাব ও প্রগ্রেস সরাসরি কাজ করবে।
            - **⚡ Continue Learning:** ১-ক্লিকে আগের পড়া লেসনে ফিরে যান।
            - **🔥 Daily Streak Tracker:** প্রতিদিনের স্ট্রিক ক্যালকুলেশন সচল।
            - **📖 Sticky Lesson Bar:** লেসন পড়ার সময় সার্বক্ষণিক নেভিগেশন।
            - **১০০% অফলাইন ও ফ্রি:** কোনো ইন্টারনেট ছাড়াই সম্পূর্ণ প্ল্যাটফর্ম সচল।

            ### যেভাবে ইনস্টল করবেন:
            1. নিচে দেওয়া **`PhotoPixC-Learn-v2.1.apk`** ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলে চাপ দিয়ে **Update/Install** বাটনে চাপ দিন!
          draft: false
          prerelease: false
          files: release-apk/PhotoPixC-Learn-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
