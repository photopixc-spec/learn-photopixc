name: Build PhotoPixC Learn Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Prepare Web Assets for Capacitor
        run: npm run prepare:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PhotoPixC-Learn-v2.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPixC-Learn-Debug-v2.0.apk
          path: release-apk/PhotoPixC-Learn-v2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Public APK Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v2.0.0
          name: PhotoPixC Learn Android App v2.0.0 (Full Mobile Redesign)
          body: |
            ## 📱 PhotoPixC Learn — Official Android App v2.0.0 (Full Mobile Redesign)

            মোবাইলের জন্য সম্পূর্ণ নতুনভাবে রিডিজাইন করা হয়েছে:
            - **📱 থাম্ব-ফ্রেন্ডলি বটম বার (Bottom Navigation):** হোম, সিলেবাস, ল্যাব ও প্রগ্রেস সরাসরি হাতের কাছে।
            - **⚡ Continue Learning Widget:** অ্যাপ খোলার সাথে সাথে ১-ক্লিকে পূর্বের পড়া লেসনে ফিরে যান।
            - **🔥 Daily Streak Tracker:** প্রতিদিনের পড়ার ধারাবাহিকতা বজায় রাখুন।
            - **📖 Sticky Lesson Bar:** লেসন পড়ার সময় নিচে সার্বক্ষণিক নেভিগেশন ও কমপ্লিট টগল।
            - **🎯 Touch-Optimized Quizzes:** আঙুল দিয়ে সহজে উত্তর দেওয়ার জন্য বড় ও আরামদায়ক টাচ কার্ড।
            - **১০০% অফলাইন ও ফ্রি:** কোনো বিজ্ঞাপন বা সাবস্ক্রিপশন নেই। সাইজ মাত্র ~৫.৮ MB।

            ### যেভাবে ইনস্টল করবেন:
            1. নিচে দেওয়া **`PhotoPixC-Learn-v2.0.apk`** ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. ডাউনলোড শেষে ফাইলে চাপ দিয়ে **Install** বাটনে চাপ দিন এবং সম্পূর্ণ অফলাইনে শেখা শুরু করুন!
          draft: false
          prerelease: false
          files: release-apk/PhotoPixC-Learn-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
