function formsHTML(){const l=LETTERS[formIndex];if(!formQuestion)makeFormQuestion();const q=formQuestion;return `<section class="panel"><div class="view-title"><div><h2>হরফের চারটি রূপ</h2><p>একই হরফ শব্দের অবস্থান অনুযায়ী ভিন্ন আকৃতি নেয়।</p></div><span class="pill">${progress.forms.length}/${LETTERS.length*4} অনুশীলন</span></div><div class="letter-picker">${LETTERS.map((x,i)=>`<button class="letter-chip ${i===formIndex?'selected':''}" data-form-letter="${i}" title="${x.n}">${x.c}</button>`).join('')}</div><div class="letter-display compact">${l.c}</div><div class="letter-meta"><h3>${l.n}</h3><p>নিচের চারটি রূপ মনোযোগ দিয়ে দেখুন। ড্যাশ মানে এই অবস্থানে আলাদা সংযুক্ত রূপ হয় না।</p></div><div class="form-grid" style="margin-top:14px">${l.forms.map((f,i)=>`<div class="form-card"><div class="arabic">${f}</div><b>${formNames[i]}</b><small>${f==='—'?'এই হরফ এখানে পরের হরফের সঙ্গে যুক্ত হয় না.':'রূপটি লক্ষ্য করুন'}</small></div>`).join('')}</div><div class="quiz-box"><p class="quiz-question">${q?`কোনটি ${l.n}-এর ${formNames[q.pos]} রূপ?`:'অনুশীলন প্রস্তুত হচ্ছে'}</p><div class="options">${q?q.options.map((x,i)=>`<button class="option" data-form-option="${i}">${x}</button>`).join(''):''}</div><div class="feedback ${formFeedback?'good':''}" id="formFeedback">${formFeedback}</div><div class="actions"><button class="btn" id="formNew">নতুন প্রশ্ন</button><button class="btn primary" id="formNextLetter">পরের হরফ</button></div></div></section>`;}
function makeFormQuestion(){const pos=Math.floor(Math.random()*4);const correct=LETTERS[formIndex].forms[pos];let options=[correct];const pool=LETTERS.flatMap(l=>l.forms).filter(f=>f!=='—'&&f!==correct);while(options.length<4){const pick=pool[Math.floor(Math.random()*pool.length)];if(!options.includes(pick))options.push(pick);}options.sort(()=>Math.random()-.5);formQuestion={pos,correct,options};formFeedback='';}
function joiningHTML(){const q=joinQuestion||makeJoinQuestion();const groups=[{title:'দুইদিকে যুক্ত হয়',letters:LETTERS.filter(l=>l.dual).map(l=>l.c).join('  '),desc:'এই হরফগুলো আগের এবং পরের দুই পাশের হরফের সঙ্গে যুক্ত হতে পারে।'},{title:'শুধু আগের হরফের সঙ্গে যুক্ত হয়',letters:LETTERS.filter(l=>!l.dual).map(l=>l.c).join('  '),desc:'এই হরফগুলো ডান পাশের আগের হরফের সঙ্গে যুক্ত হতে পারে, কিন্তু বাম পাশের পরের হরফের সঙ্গে যুক্ত হয় না।'},{title:'বিশেষ চিহ্ন',letters:'ء أ إ آ ؤ ئ ة ى',desc:'এগুলো হামযা, তা মারবুতা ও আলিফ মাকসুরার মতো বিশেষ রূপ। শব্দে এদের সংযোগ আলাদা করে লক্ষ্য করুন।'}];return `<section class="panel"><div class="view-title"><div><h2>হরফ জোড়া লাগানো শিখি</h2><p>আরবি ডান দিক থেকে বামে লেখা হয়। সংযোগের নিয়ম বুঝুন।</p></div><span class="pill">গুরুত্বপূর্ণ নিয়ম</span></div><div class="rule-box"><strong>সহজ নিয়ম</strong><p style="margin:5px 0 0">আরবি শব্দে প্রতিটি হরফ সবসময় দুই পাশে যুক্ত হয় না। ا د ذ ر ز و সাধারণত পরের হরফের সঙ্গে বাম দিকে সংযোগ করে না। তাই শব্দে সংযোগ ভেঙে যায়।</p></div><div class="join-groups">${groups.map(g=>`<div class="join-group"><h3>${g.title}</h3><div class="arabic">${g.letters}</div><p>${g.desc}</p></div>`).join('')}</div><div class="quiz-box"><p class="quiz-question">${q.letter} (${q.name}) কি তার পরের হরফের সঙ্গে বাম দিকে যুক্ত হতে পারে?</p><div class="actions"><button class="btn" data-join-answer="yes">হ্যাঁ, যুক্ত হয়</button><button class="btn" data-join-answer="no">না, যুক্ত হয় না</button></div><div class="feedback ${joinFeedback?'good':''}">${joinFeedback}</div><div class="actions"><button class="btn primary" id="joinNew">আরেকটি প্রশ্ন</button></div></div><div class="rule-box"><strong>দেখে বুঝুন</strong><div class="arabic" style="font-size:54px">بَابٌ　قَلَمٌ　نُورٌ</div><p style="margin:0">বাম পাশের অক্ষরের সঙ্গে কোন অক্ষর যুক্ত হয়েছে আর কোথায় সংযোগ ভেঙেছে, শব্দগুলোতে খেয়াল করুন।</p></div></section>`;}
function makeJoinQuestion(){const l=LETTERS[Math.floor(Math.random()*LETTERS.length)];joinFeedback='';joinQuestion={letter:l.c,name:l.n,answer:l.dual};return joinQuestion;}
function harakatHTML(){const mark=MARKS[harakatIndex];return `<section class="panel"><div class="view-title"><div><h2>হারাকাত শিখি</h2><p>হরফের সঙ্গে চিহ্ন বসিয়ে স্বরধ্বনি ও উচ্চারণের পার্থক্য বুঝুন।</p></div><span class="pill">${harakatIndex+1}/${MARKS.length}</span></div><div class="mark-list">${MARKS.map((m,i)=>`<button class="mark-card ${i===harakatIndex?'active':''}" data-mark="${i}" style="${i===harakatIndex?'border:2px solid var(--accent);':''}"><div class="arabic">ب${m.m}</div><b>${m.name}</b><small>${m.sound}</small></button>`).join('')}</div><div class="two-col" style="margin-top:18px"><div><div class="letter-display compact">${mark.example}</div><div class="letter-meta"><h3>${mark.name}</h3><p>ধ্বনি: ${mark.sound}</p></div><div class="rule-box"><strong>কীভাবে চিনবেন</strong><p style="margin:5px 0 0">${mark.hint}</p></div></div><div><h3 style="margin-top:0">একই হরফে সব হারাকাত</h3><div class="form-grid" style="grid-template-columns:repeat(3,1fr)">${MARKS.slice(0,8).map(m=>`<div class="form-card"><div class="arabic">ب${m.m}</div><small>${m.name.split(' / ')[0]}</small></div>`).join('')}</div><p class="notice">হারাকাতের চিহ্নের অবস্থান ও নাম শিখুন। কুরআন তিলাওয়াতের সঠিক মাখরাজ ও তাজবিদ শেখার জন্য শিক্ষক/বিশ্বস্ত অডিওর সাহায্য নিন।</p></div></div><div class="actions"><button class="btn" id="markPrev">আগের</button><button class="btn primary" id="markNext">পরের হারাকাত</button></div></section>`;}
function wordPool(){return WORDS.filter(w=>wordFilter==='all'||String(w.level)===wordFilter);}
function currentWord(){const pool=wordPool();if(!pool.length)return WORDS[0];wordIndex=(wordIndex+pool.length)%pool.length;return pool[wordIndex];}
function wordsHTML(){const pool=wordPool(),w=currentWord();targetClusters=splitClusters(w.ar);const totalDone=pool.filter(x=>progress.words.includes(x.id)).length;const letterPractice=wordMode==='hand'&&handKind==='letter';const displayAr=letterPractice?handTarget:w.ar;const displayMeaning=letterPractice?'হরফ লেখা অনুশীলন':w.meaning;const displayPron=letterPractice?'হরফের নাম ও আকৃতি অনুশীলন':`উচ্চারণ: ${w.bn}　|　রেফারেন্স: ${w.ref}`;return `<section class="panel"><div class="view-title"><div><h2>${letterPractice?'হরফ লিখে অনুশীলন':'শব্দ লিখে অনুশীলন'}</h2><p>প্রথমে কীবোর্ডে, তারপর হাতে লিখে একই শব্দ অনুশীলন করুন।</p></div><span class="pill">${pool.length}টি শব্দ</span></div><div class="word-controls"><label>কঠিনতার স্তর <select class="select" id="wordFilter"><option value="all" ${wordFilter==='all'?'selected':''}>সব শব্দ</option><option value="1" ${wordFilter==='1'?'selected':''}>সহজ</option><option value="2" ${wordFilter==='2'?'selected':''}>মাঝারি</option><option value="3" ${wordFilter==='3'?'selected':''}>চ্যালেঞ্জ</option></select></label><span class="tag">এই স্তরে শেখা: ${totalDone}/${pool.length}</span></div><div class="mode-switch"><button class="btn ${wordMode==='keyboard'?'active':''}" id="modeKeyboard">⌨ কীবোর্ডে লিখি</button><button class="btn ${wordMode==='hand'?'active':''}" id="modeHand">✍ হাতে লিখি</button></div><div class="word-info"><div class="word-display">${displayAr}</div><p class="meaning">${displayMeaning}</p><p class="pronunciation">${displayPron}</p>${letterPractice?'':`<div class="tag-row"><span class="tag">${w.level===1?'সহজ':w.level===2?'মাঝারি':'চ্যালেঞ্জ'}</span><span class="tag">শব্দ ${pool.findIndex(x=>x.id===w.id)+1} / ${pool.length}</span></div>`}</div>${wordMode==='keyboard'?keyboardModeHTML(w):handModeHTML(w)}<div class="word-nav"><button class="btn" id="wordPrev">← আগের শব্দ</button><span class="notice">${progress.words.includes(w.id)?'এই শব্দটি আগে সম্পন্ন করেছেন ✓':'শব্দটি লিখে সম্পন্ন করুন'}</span><button class="btn primary" id="wordNext">পরের শব্দ →</button></div></section>`;}
function keyboardModeHTML(w){return `<div class="quiz-box"><p class="quiz-question">নিচের ভার্চুয়াল কীবোর্ড দিয়ে উপরের শব্দটি হুবহু লিখুন।</p><div class="typed-output" id="typedOutput"><span class="placeholder">কীবোর্ড থেকে অক্ষর ও হারাকাত বেছে নিন…</span></div><div class="feedback" id="wordFeedback"></div><div class="keyboard" id="keyboard"></div><div class="actions"><button class="btn" id="keyBack">⌫ একটি মুছুন</button><button class="btn" id="keyClear">সব মুছুন</button><button class="btn" id="keyHint">ইঙ্গিত</button><button class="btn primary" id="keyCheck">যাচাই</button></div></div>`;}
function handModeHTML(w){if(handKind!=='letter')handTarget=w.ar;return `<div class="quiz-box"><p class="quiz-question">নিচের জায়গায় আঙুল বা মাউস দিয়ে ${handKind==='letter'?'হরফটি':'শব্দটি'} লিখুন।</p><div class="mode-switch"><button class="btn ${handTrace?'active':''}" id="traceOn">নমুনা দেখিয়ে লিখি</button><button class="btn ${!handTrace?'active':''}" id="traceOff">না দেখে লিখি</button></div><div class="canvas-wrap"><canvas id="writeCanvas" aria-label="আরবি লেখার অনুশীলনের জায়গা"></canvas></div><p class="canvas-note">${handTrace?'হালকা নমুনার ওপর দিয়ে লিখুন।':'মনে করে নিজে লিখুন।' } আঙুল/স্টাইলাস/মাউস ব্যবহার করতে পারবেন।</p><div class="actions"><button class="btn" id="canvasUndo">↶ আগের দাগ মুছুন</button><button class="btn" id="canvasClear">পরিষ্কার</button><button class="btn" id="canvasSample">নমুনা দেখুন</button><button class="btn primary" id="canvasDone">আমি লিখেছি</button></div><div class="feedback" id="handFeedback">নিজের লেখা নমুনার সঙ্গে মিলিয়ে দেখুন।</div></div>`;}
function buildKeyboard(){const el=$('keyboard');if(!el)return;el.innerHTML='';const rows=['ضصثقفغعهخحج','شسيبلاتنمكط','ئءؤرىةوزظدذ','أإآ'];rows.forEach(row=>{const div=document.createElement('div');div.className='key-row';[...row].forEach(ch=>div.appendChild(makeKey(ch,ch,'')));el.appendChild(div);});const extras=document.createElement('div');extras.className='key-row';['ا','ب','ت','ج','ح','خ','د','ر','س','ش','ص','ط','ع','ف','ق','ك','ل','م','ن','ه','و','ي'].forEach(ch=>{});MARKS.forEach(m=>extras.appendChild(makeKey('◌'+m.m,m.m,'mark',m.name)));el.appendChild(extras);}
function makeKey(label,value,cls,title){const b=document.createElement('button');b.className='key '+cls;b.type='button';b.innerHTML=`<span>${esc(label)}</span>${title?`<small>${esc(title)}</small>`:''}`;b.addEventListener('click',()=>pressKey(value));return b;}
const isMark=c=>/[\u064B-\u0652\u0670]/u.test(c);
const markOrder=c=>c==='ّ'?0:c.codePointAt(0);
function splitClusters(s){const out=[];for(const c of s.replace(/ـ/g,'')){if(isMark(c)&&out.length)out[out.length-1].marks.push(c);else if(!isMark(c))out.push({base:c,marks:[]});}return out.map(x=>{x.marks.sort((a,b)=>markOrder(a)-markOrder(b));return {...x,key:x.base+x.marks.join('')};});}
function typedKeys(){return typed.map(x=>x.base+[...x.marks].sort((a,b)=>markOrder(a)-markOrder(b)).join(''));}
function pressKey(v){if(wordSolved)return;if(isMark(v)){if(!typed.length)return;typed[typed.length-1].marks.push(v);}else typed.push({base:v,marks:[]});renderTyped();}
function renderTyped(){const out=$('typedOutput');if(!out)return;const t=typedKeys(),target=targetClusters.map(x=>x.key);let ok=0;while(ok<t.length&&ok<target.length&&t[ok]===target[ok])ok++;out.innerHTML='';if(!t.length){out.innerHTML='<span class="placeholder">কীবোর্ড থেকে অক্ষর ও হারাকাত বেছে নিন…</span>';return;}t.forEach((v,i)=>{const s=document.createElement('span');s.textContent=v;s.className=i<ok?'good':(i===ok?'bad':'');out.appendChild(s);});const fb=$('wordFeedback');if(fb){fb.className='feedback '+(ok===target.length&&t.length===target.length?'good':ok<t.length?'bad':'');fb.textContent=ok===target.length&&t.length===target.length?'সঠিক হয়েছে! শব্দটি সম্পন্ন।':ok<t.length?'এখানে অক্ষর বা হারাকাত মিলছে না।':'';}}
function loadWord(newIndex){const pool=wordPool();wordIndex=(newIndex+pool.length)%pool.length;typed=[];canvasStrokes=[];handKind='word';wordSolved=false;const w=currentWord();targetClusters=splitClusters(w.ar);render();}
function finishWord(){if(wordSolved)return;const t=typedKeys(),target=targetClusters.map(x=>x.key);if(t.length===target.length&&t.every((x,i)=>x===target[i])){const w=currentWord();if(!progress.words.includes(w.id))progress.words.push(w.id);progress.correct++;progress.attempts++;progress.mistakes[w.id]=Math.max(0,(progress.mistakes[w.id]||0)-1);progress.review=progress.review.filter(x=>x!==w.id);wordSolved=true;saveProgress();const fb=$('wordFeedback');if(fb){fb.className='feedback good';fb.textContent='সঠিক হয়েছে! শব্দটি সম্পন্ন।';}const out=$('typedOutput');if(out)out.style.borderColor='var(--good)';}else{progress.attempts++;const w=currentWord();progress.mistakes[w.id]=(progress.mistakes[w.id]||0)+1;if(!progress.review.includes(w.id))progress.review.push(w.id);saveProgress();const fb=$('wordFeedback');if(fb){fb.className='feedback bad';fb.textContent='এখনো মেলেনি। অক্ষর ও হারাকাত পরীক্ষা করুন।';}}}
function hintWord(){const t=typedKeys(),target=targetClusters.map(x=>x.key);let i=0;while(i<t.length&&i<target.length&&t[i]===target[i])i++;const c=targetClusters[i];if(!c)return;const fb=$('wordFeedback');if(fb){fb.className='feedback';fb.textContent=`পরের অক্ষর: ${c.base}${c.marks.join('')} । আগে অক্ষরটি, তারপর তার হারাকাত দিন।`;}}
function initCanvas(){const canvas=$('writeCanvas');if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));canvasCtx=canvas.getContext('2d');canvasCtx.scale(dpr,dpr);drawCanvas();canvas.onpointerdown=e=>{canvasDrawing=true;canvas.setPointerCapture(e.pointerId);const p=canvasPoint(e,canvas);canvasCtx.beginPath();canvasCtx.moveTo(p.x,p.y);canvasStrokes.push({points:[p]});};canvas.onpointermove=e=>{if(!canvasDrawing)return;const p=canvasPoint(e,canvas);const stroke=canvasStrokes[canvasStrokes.length-1];stroke.points.push(p);canvasCtx.strokeStyle='#17312c';canvasCtx.lineWidth=5;canvasCtx.lineCap='round';canvasCtx.lineJoin='round';canvasCtx.lineTo(p.x,p.y);canvasCtx.stroke();};canvas.onpointerup=canvas.onpointercancel=()=>{canvasDrawing=false;};}
function canvasPoint(e,canvas){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function drawCanvas(){const c=$('writeCanvas');if(!c||!canvasCtx)return;const w=c.clientWidth,h=c.clientHeight;canvasCtx.clearRect(0,0,w,h);canvasCtx.fillStyle='#fff';canvasCtx.fillRect(0,0,w,h);canvasCtx.strokeStyle='#e5ece9';canvasCtx.lineWidth=1;for(let y=45;y<h;y+=55){canvasCtx.beginPath();canvasCtx.moveTo(0,y);canvasCtx.lineTo(w,y);canvasCtx.stroke();}if(handTrace&&handTarget){canvasCtx.save();canvasCtx.globalAlpha=.18;canvasCtx.fillStyle='#17312c';canvasCtx.direction='rtl';canvasCtx.textAlign='center';const fs=Math.min(104,Math.max(42,Math.floor(w/(Math.max(2,[...handTarget].length)*.75))));canvasCtx.font=`${fs}px "Amiri Quran", "Traditional Arabic", serif`;canvasCtx.fillText(handTarget,w/2,h/2+fs*.32,w-30);canvasCtx.restore();}canvasStrokes.forEach(s=>{if(!s.points.length)return;canvasCtx.beginPath();canvasCtx.moveTo(s.points[0].x,s.points[0].y);s.points.slice(1).forEach(p=>canvasCtx.lineTo(p.x,p.y));canvasCtx.strokeStyle='#17312c';canvasCtx.lineWidth=5;canvasCtx.lineCap='round';canvasCtx.lineJoin='round';canvasCtx.stroke();});}
function canvasClear(){canvasStrokes=[];drawCanvas();}
function reviewHTML(){const ids=progress.review.filter(id=>WORDS.some(w=>w.id===id));const list=ids.map(id=>WORDS.find(w=>w.id===id));return `<section class="panel"><div class="view-title"><div><h2>ভুলের রিভিশন</h2><p>যে শব্দে ভুল হয়েছে সেগুলো আবার লিখুন।</p></div><span class="pill">${list.length}টি রিভিশন</span></div>${list.length?`<div class="grid cards">${list.map(w=>`<button class="lesson-card" data-review-word="${w.id}"><span class="big-icon arabic-small">${w.ar}</span><strong>${w.meaning}</strong><span>${w.ref} · ভুল: ${progress.mistakes[w.id]||0} বার</span></button>`).join('')}</div><div class="actions"><button class="btn" id="clearReview">রিভিশন তালিকা খালি করুন</button></div>`:'<div class="empty">এখনো কোনো ভুল শব্দ জমা হয়নি। শব্দ অনুশীলন শুরু করুন।</div>'}<div class="rule-box"><strong>আপনার অগ্রগতি</strong><p style="margin:5px 0 0">মোট চেষ্টা: ${progress.attempts} · সঠিকভাবে সম্পন্ন: ${progress.correct} · সম্পন্ন শব্দ: ${progress.words.length}/${WORDS.length}</p></div></section>`;}
function markDoneLetter(){const c=LETTERS[letterIndex].c;if(!progress.letters.includes(c))progress.letters.push(c);saveProgress();render();}
function bindEvents(){
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.go)));
 document.querySelectorAll('[data-letter]').forEach(b=>b.addEventListener('click',()=>{letterIndex=Number(b.dataset.letter);render();}));
 document.querySelectorAll('[data-letter-key]').forEach(b=>b.addEventListener('click',()=>{const ok=b.dataset.letterKey===LETTERS[letterIndex].c;const fb=$('letterKeyFeedback');if(fb){fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'সঠিক হরফ! আপনি কীবোর্ডে এটি খুঁজে পেয়েছেন।':'এটি অন্য হরফ। আবার চেষ্টা করুন।';}if(ok&&!progress.letters.includes(LETTERS[letterIndex].c)){progress.letters.push(LETTERS[letterIndex].c);saveProgress();}}));
 document.querySelectorAll('[data-form-letter]').forEach(b=>b.addEventListener('click',()=>{formIndex=Number(b.dataset.formLetter);makeFormQuestion();render();}));
 document.querySelectorAll('[data-form-option]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.formOption);const ok=formQuestion.options[i]===formQuestion.correct;formFeedback=ok?'সঠিক! এই রূপটি ঠিক।':'এটি সঠিক নয়। চারটি রূপ আবার দেখুন।';if(ok){const id=LETTERS[formIndex].c+':'+formQuestion.pos;if(!progress.forms.includes(id))progress.forms.push(id);saveProgress();}document.querySelectorAll('[data-form-option]').forEach((x,j)=>{x.disabled=true;if(formQuestion.options[j]===formQuestion.correct)x.classList.add('correct');else if(j===i)x.classList.add('wrong');});const fb=$('formFeedback');if(fb){fb.className='feedback '+(ok?'good':'bad');fb.textContent=formFeedback;}}));
 document.querySelectorAll('[data-join-answer]').forEach(b=>b.addEventListener('click',()=>{const answer=b.dataset.joinAnswer==='yes';const ok=answer===joinQuestion.answer;joinFeedback=ok?'সঠিক! '+joinQuestion.name+' এর সংযোগের নিয়ম ঠিক ধরেছেন।':'আবার দেখুন। '+joinQuestion.name+' এর নিয়ম: '+(joinQuestion.answer?'দুইদিকে যুক্ত হয়।':'পরের হরফের সঙ্গে বাম দিকে যুক্ত হয় না।');document.querySelectorAll('[data-join-answer]').forEach(x=>x.disabled=true);const fb=document.querySelector('.quiz-box .feedback');if(fb){fb.className='feedback '+(ok?'good':'bad');fb.textContent=joinFeedback;}}));
 document.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click',()=>{harakatIndex=Number(b.dataset.mark);render();}));
 document.querySelectorAll('[data-review-word]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.reviewWord);wordFilter='all';wordIndex=WORDS.findIndex(w=>w.id===id);wordMode='keyboard';setView('words');}));
 const on=(id,fn)=>{const e=$(id);if(e)e.addEventListener('click',fn);};
 on('letterPrev',()=>{letterIndex=(letterIndex+LETTERS.length-1)%LETTERS.length;render();});on('letterNext',()=>{letterIndex=(letterIndex+1)%LETTERS.length;render();});on('letterDone',markDoneLetter);on('toForms',()=>{formIndex=letterIndex;makeFormQuestion();setView('forms');});on('letterWrite',()=>{handTarget=LETTERS[letterIndex].c;handKind='letter';wordMode='hand';canvasStrokes=[];setView('words');});
 on('formNew',()=>{makeFormQuestion();render();});on('formNextLetter',()=>{formIndex=(formIndex+1)%LETTERS.length;makeFormQuestion();render();});on('joinNew',()=>{makeJoinQuestion();render();});on('markPrev',()=>{harakatIndex=(harakatIndex+MARKS.length-1)%MARKS.length;render();});on('markNext',()=>{harakatIndex=(harakatIndex+1)%MARKS.length;render();});
 on('modeKeyboard',()=>{wordMode='keyboard';handKind='word';typed=[];wordSolved=false;render();});on('modeHand',()=>{wordMode='hand';handKind='word';typed=[];canvasStrokes=[];wordSolved=false;render();});
 const filter=$('wordFilter');if(filter)filter.addEventListener('change',()=>{wordFilter=filter.value;wordIndex=0;typed=[];canvasStrokes=[];wordSolved=false;render();});
 on('wordPrev',()=>loadWord(wordIndex-1));on('wordNext',()=>loadWord(wordIndex+1));
 on('keyBack',()=>{if(wordSolved)return;if(!typed.length)return;const last=typed[typed.length-1];if(last.marks.length)last.marks.pop();else typed.pop();renderTyped();});on('keyClear',()=>{if(wordSolved)return;typed=[];renderTyped();});on('keyHint',hintWord);on('keyCheck',finishWord);
 on('traceOn',()=>{handTrace=true;render();});on('traceOff',()=>{handTrace=false;render();});on('canvasClear',canvasClear);on('canvasUndo',()=>{canvasStrokes.pop();drawCanvas();});on('canvasSample',()=>{handTrace=true;drawCanvas();const fb=$('handFeedback');if(fb)fb.textContent='নমুনা দেখানো হয়েছে।';});on('canvasDone',()=>{const fb=$('handFeedback');if(!canvasStrokes.length){if(fb){fb.className='feedback bad';fb.textContent='আগে ক্যানভাসে অন্তত একবার লিখুন।';}return;}if(fb){fb.className='feedback good';fb.textContent='আপনি লেখা শেষ করেছেন। এবার নমুনা দেখুন এবং নিজের লেখার সঙ্গে মিলিয়ে নিন।';}handTrace=true;drawCanvas();if(handKind==='letter'){const c=LETTERS[letterIndex].c;if(!progress.letters.includes(c))progress.letters.push(c);}else{const w=currentWord();if(!progress.words.includes(w.id))progress.words.push(w.id);progress.review=progress.review.filter(x=>x!==w.id);}saveProgress();});
 on('clearReview',()=>{progress.review=[];saveProgress();render();});
}
function bindGlobal(){document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';progress.theme=dark?'dark':'light';$('themeBtn').textContent=dark?'☀':'☾';saveProgress();});}
function renderAndBind(){render();bindEvents();}
// Re-render after navigation and attach view-specific handlers.
const originalRender=render;render=function(){originalRender();bindEvents();};
bindGlobal();document.documentElement.dataset.theme=progress.theme||'light';$('themeBtn').textContent=progress.theme==='dark'?'☀':'☾';
// Correctly initialize the word typing target before the first word view is opened.
function prepareWord(){const w=currentWord();targetClusters=splitClusters(w.ar);typed=[];wordSolved=false;}
prepareWord();render();
</script>
